<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Grimora · Roteiro de Diagnóstico</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23F06719'/%3E%3Ctext x='32' y='45' font-size='38' font-weight='800' text-anchor='middle' font-family='Arial' fill='%23121212'%3EG%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#F7F3ED; --surface:#FFFFFF; --surface-2:#FBF9F5; --ink:#121212; --muted:#625D57; --line:#E2DCD3;
  --accent:#F06719; --on-accent:#121212; --accent-text:#BF4E08; --accent-soft:#FDEBDD;
  --good:#1E7F4F; --good-soft:#E4F4EA; --warn:#9A4A06; --warn-soft:#FFF1DC; --danger:#B3261E;
  --card-dark:#121212; --on-card-dark:#F4EFE8;
  --shadow:0 1px 2px rgba(18,18,18,.05),0 8px 24px rgba(18,18,18,.06);
  --r:16px; --topbar-h:64px;
  --font:Aptos,"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121110; --surface:#1D1B19; --surface-2:#262321; --ink:#F4EFE8; --muted:#A8A096; --line:#37322D;
    --accent:#FF7A2E; --accent-text:#FF9A5C; --accent-soft:#3A2314;
    --good:#5CD08F; --good-soft:#16301F; --warn:#FFB066; --warn-soft:#3A2A12; --danger:#FF8A80;
    --card-dark:#0A0908; --on-card-dark:#F4EFE8; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#121110; --surface:#1D1B19; --surface-2:#262321; --ink:#F4EFE8; --muted:#A8A096; --line:#37322D;
  --accent:#FF7A2E; --accent-text:#FF9A5C; --accent-soft:#3A2314;
  --good:#5CD08F; --good-soft:#16301F; --warn:#FFB066; --warn-soft:#3A2A12; --danger:#FF8A80;
  --card-dark:#0A0908; --on-card-dark:#F4EFE8; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--font)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{flex:none}

/* ---------- barra superior ---------- */
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-inner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:1280px;margin:0 auto;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:800;font-size:17px}
.brand b{letter-spacing:.2em;font-size:14px;font-weight:800}
.brand .sub{color:var(--muted);font-size:13px;white-space:nowrap}
.spacer{flex:1}
.topprog{height:3px;background:var(--line)}
.topprog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;line-height:1.2;text-decoration:none}
.btn:hover{border-color:color-mix(in srgb,var(--ink) 30%,var(--line))}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent}
.btn.icon{width:44px;padding:0}
.btn.small{min-height:36px;padding:0 12px;font-size:15px}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.meeting-btn{max-width:min(240px,30vw);justify-content:flex-start}
@media (max-width:1360px){.brand .sub{display:none}}
.meeting-btn span.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:2px}
.timer .t{font-variant-numeric:tabular-nums;font-weight:700;min-width:58px;text-align:center}
.timer.running .t{color:var(--accent-text)}
.timer .btn{min-height:40px;width:40px;border:0;background:transparent;padding:0}
.savechip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px}
.savechip .dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.savechip[data-state="ok"] .dot{background:var(--good)}
.savechip[data-state="browser"]{background:var(--warn-soft);border-color:transparent}
.savechip[data-state="browser"] .dot,.savechip[data-state="perm"] .dot{background:var(--warn)}
.savechip[data-state="perm"]{background:var(--warn-soft);border-color:transparent}
.savechip[data-state="error"]{background:var(--danger);border-color:var(--danger);color:#fff}
.savechip[data-state="error"] .dot{background:#fff}
.banner{background:var(--accent-soft);border-bottom:1px solid var(--line)}
.banner-inner{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{flex:1;min-width:240px;font-size:15px}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:290px minmax(0,1fr);gap:28px;max-width:1280px;margin:0 auto;padding:22px 16px 120px}
.nav{position:sticky;top:calc(var(--topbar-h) + 16px);align-self:start;max-height:calc(100vh - var(--topbar-h) - 32px);overflow:auto;padding-bottom:8px}
.progress-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.progress-card .row{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:8px}
.progress-card .row b{color:var(--ink)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.nav-list{display:flex;flex-direction:column;gap:4px}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;border-radius:12px;padding:8px 10px;min-height:48px;color:var(--ink)}
.nav-item:hover{background:var(--surface)}
.nav-item.active{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent),var(--shadow)}
.nav-item .badge{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:700;flex:none;color:var(--muted)}
.nav-item.active .badge{border-color:var(--accent);color:var(--accent-text)}
.nav-item.complete .badge{background:var(--good);border-color:var(--good);color:#fff}
.nav-item .ttl{flex:1;min-width:0;font-size:15px;font-weight:600;line-height:1.25}
.nav-item .short{display:none}
.nav-item .meta{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav-item .flagbadge{display:inline-flex;align-items:center;gap:2px;color:var(--accent-text);font-weight:700}

main{min-width:0}
.sec-head{display:flex;gap:16px;align-items:flex-start;margin-bottom:18px}
.sec-num{width:48px;height:48px;border-radius:14px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
.sec-head h1{font-size:clamp(26px,3.4vw,36px);line-height:1.15;letter-spacing:-.02em}
.sec-head .lead{color:var(--muted);margin-top:4px;font-size:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h2{font-size:19px;margin-bottom:12px}
.hint{color:var(--muted);font-size:15px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text)}

/* itens */
.item{display:grid;grid-template-columns:40px minmax(0,1fr) auto;column-gap:12px;row-gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;transition:border-color .15s,box-shadow .15s}
.item.done{background:var(--surface-2)}
.item.flag{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.check{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;color:transparent;padding:0}
.check:hover{border-color:var(--good)}
.check[aria-checked="true"]{background:var(--good);border-color:var(--good);color:#fff}
.q{font-size:18px;font-weight:600;line-height:1.35;padding-top:6px}
.item.done .q{color:var(--muted)}
.q-input{width:100%;font-weight:600;font-size:18px;border:0;border-bottom:2px dashed var(--line);background:transparent;padding:6px 0;border-radius:0}
.q-input:focus{outline:none;border-bottom-color:var(--accent)}
.actions{display:flex;gap:6px;align-items:flex-start}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid transparent;background:transparent;display:grid;place-items:center;color:var(--muted);padding:0}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.iconbtn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.iconbtn[aria-pressed="true"] svg{fill:currentColor}
.note{grid-column:2/-1}
textarea.note,textarea.inp,input.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2);color:var(--ink);resize:none;min-height:46px;display:block;overflow:hidden;line-height:1.45}
input.inp{overflow:visible}
textarea.note:focus,textarea.inp:focus,input.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
textarea::placeholder,input::placeholder{color:color-mix(in srgb,var(--muted) 75%,transparent)}
.add-row{margin:6px 0 20px}
.sec-notes{margin-top:8px}
.sec-notes label{display:block;font-weight:700;margin-bottom:8px}

/* formulários */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.wide{grid-column:1/-1}
.field .lbl{font-size:14px;font-weight:700;color:var(--muted)}
.tiplist{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.tiplist li{display:flex;gap:12px;align-items:flex-start;font-size:18px}
.tiplist li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:10px;flex:none}

/* pergunta-chave */
.key-card{background:var(--card-dark);color:var(--on-card-dark);border-radius:20px;padding:28px;margin-bottom:16px;border:1px solid var(--line)}
.key-card .eyebrow{color:var(--accent)}
.key-q{font-size:clamp(24px,3.6vw,36px);line-height:1.2;font-weight:700;letter-spacing:-.02em;margin-top:10px}
.key-q em{font-style:normal;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:8px 18px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.chip .rank{width:24px;height:24px;border-radius:50%;background:var(--on-accent);color:var(--accent);display:grid;place-items:center;font-size:13px;font-weight:800}

/* resumo / fechamento */
.flag-list{display:grid;gap:8px}
.flag-link{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--surface-2);border-radius:12px;padding:10px 14px}
.flag-link:hover{border-color:var(--accent)}
.flag-link .tag{font-size:12px;font-weight:800;color:var(--accent-text);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.flag-link .tx{flex:1;min-width:0}
.flag-link .tx b{display:block;font-weight:600}
.flag-link .tx span{display:block;color:var(--muted);font-size:15px;white-space:pre-wrap}
.sum-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:14px}
.script{font-size:clamp(19px,2.4vw,24px);line-height:1.5;background:var(--card-dark);color:var(--on-card-dark);border-radius:18px;padding:26px;margin-bottom:16px}
.script mark{background:none;color:var(--accent);font-weight:700;border-bottom:2px solid var(--accent)}
.script .blank{color:var(--accent);opacity:.8}
.closing-end{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:20px;margin-bottom:16px}
.closing-end h2{margin-bottom:6px}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.tagline{margin-top:28px;text-align:center;color:var(--muted);font-size:14px}
.tagline b{color:var(--ink);letter-spacing:.14em}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:22px}
.pager .btn{flex:1;max-width:340px;justify-content:space-between}
.pager .btn small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.pager .btn.primary small{color:inherit;opacity:.75}
.pager .txt{display:flex;flex-direction:column;align-items:flex-start;text-align:left}
.pager .next .txt{align-items:flex-end;text-align:right}

/* gaveta de notas */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:40;background:var(--surface);border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(0,0,0,.18);display:flex;flex-direction:column;padding:16px;gap:12px}
#drawer[hidden]{display:none}
#drawer header{display:flex;align-items:center;gap:10px}
#drawer h2{font-size:19px;flex:1}
#drawer textarea{flex:1;width:100%;resize:none;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface-2);line-height:1.5;min-height:200px}
#drawer textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}

/* diálogos */
dialog{border:1px solid var(--line);border-radius:20px;padding:0;background:var(--surface);color:var(--ink);box-shadow:0 24px 80px rgba(0,0,0,.35);width:min(680px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgba(10,9,8,.55)}
.dlg{padding:22px;display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 26px);overflow:auto}
.dlg header{display:flex;align-items:center;gap:10px}
.dlg header h2{flex:1;font-size:21px}
.dlg h3{font-size:16px;margin-bottom:6px}
.dlg .block{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--surface-2)}
.dlg .block p{color:var(--muted);font-size:15px;margin-bottom:10px}
.status-line{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:10px}
.status-line .dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.status-line.ok .dot{background:var(--good)}
.status-line.warn .dot{background:var(--warn)}
.status-line.err .dot{background:var(--danger)}
.mlist{display:grid;gap:8px}
.mrow{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2)}
.mrow.current{border-color:var(--accent);background:var(--accent-soft)}
.mrow .info{flex:1;min-width:0}
.mrow .info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .info span{color:var(--muted);font-size:14px}
pre.preview{margin:0;white-space:pre-wrap;word-break:break-word;font:14px/1.55 ui-monospace,Consolas,"Cascadia Mono",monospace;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px;max-height:42vh;overflow:auto}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#121212;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:calc(100vw - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.sshort{display:none}
.t-ico{display:grid;margin-left:8px}
.fab{display:none;position:fixed;right:16px;bottom:16px;z-index:35;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.28)}

/* ---------- celular / tablet ---------- */
@media (max-width:1000px){
  .app{grid-template-columns:minmax(0,1fr);gap:12px;padding-top:12px}
  .nav{position:sticky;top:var(--topbar-h);z-index:20;margin:0 -16px;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--line);max-height:none;overflow:visible}
  .progress-card{display:none}
  .nav-list{flex-direction:row;overflow-x:auto;gap:6px;scrollbar-width:none;padding-bottom:2px}
  .nav-list::-webkit-scrollbar{display:none}
  .nav-item{width:auto;flex:none;border:1px solid var(--line);background:var(--surface);padding:6px 14px 6px 8px;min-height:44px;border-radius:99px}
  .nav-item.active{box-shadow:none;border-color:var(--accent);background:var(--accent-soft)}
  .nav-item .ttl{display:none}
  .nav-item .short{display:inline;font-size:14px;font-weight:600;white-space:nowrap}
  .nav-item .meta{font-size:12px}
}
@media (max-width:1000px){
  .brand b{display:none}
  .btn .lbl{display:none}
  .btn.has-lbl{width:44px;padding:0}
  .meeting-btn.has-lbl{width:auto;padding:0 14px}
  .meeting-btn .name.lbl{display:block}
  .savechip .stxt{display:none}
  .savechip .sshort{display:inline}
}
@media (max-width:720px){
  body{font-size:16px}
  .topbar{position:static}
  .topbar-inner{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:8px 10px;align-items:center}
  .brand{grid-row:1;grid-column:1}
  .meeting-btn,.meeting-btn.has-lbl{grid-row:1;grid-column:2/5;max-width:none;width:100%}
  #btnTheme{grid-row:1;grid-column:5}
  .spacer{display:none}
  .timer{grid-row:2;grid-column:1/3;justify-self:start}
  .t-ico{display:none}
  #chip{grid-row:2;grid-column:3}
  #btnNotes{grid-row:2;grid-column:4}
  #btnReport{grid-row:2;grid-column:5}
  .nav{top:0}
  .savechip .sshort{display:none}
  .fab{display:grid}
  .form-grid,.sum-grid{grid-template-columns:1fr}
  .sec-num{width:42px;height:42px;font-size:19px}
  .sec-head .lead{font-size:16px}
  .card{padding:16px}
  .q,.q-input{font-size:17px}
  .key-card{padding:20px}
  .script{padding:18px}
  .pager .btn{padding:0 12px}
  .savechip{padding:0 12px}
}

/* ---------- impressão ---------- */
#print{display:none}
@media print{
  html,body{background:#fff!important;color:#000!important}
  body>*:not(#print){display:none!important}
  #print{display:block;font:11pt/1.45 var(--font);color:#000}
  #print h1{font-size:22pt;margin:0 0 2pt}
  #print h2{font-size:13pt;margin:16pt 0 6pt;padding-bottom:3pt;border-bottom:2px solid #F06719;break-after:avoid}
  #print h3{font-size:11pt;margin:10pt 0 4pt;break-after:avoid}
  #print .p-brand{font-weight:800;letter-spacing:.2em;color:#F06719;font-size:10pt}
  #print .p-meta{color:#444;font-size:10pt}
  #print table{border-collapse:collapse;width:100%;margin:6pt 0}
  #print td{padding:3pt 8pt 3pt 0;vertical-align:top;font-size:10.5pt}
  #print td:first-child{width:28%;color:#555;font-weight:700}
  #print .qa{margin:0 0 7pt;break-inside:avoid}
  #print .qa .q{font-size:10.5pt;font-weight:700;padding:0}
  #print .qa .a{margin:1pt 0 0;white-space:pre-wrap;padding-left:10pt;border-left:2px solid #ccc}
  #print .qa.flag .q::before{content:"⚑ ";color:#F06719}
  #print .none{color:#777;font-style:italic}
  @page{margin:16mm 14mm}
}
</style>
</head>
<body>

<header class="topbar" id="topbar">
  <div class="topbar-inner">
    <div class="brand"><span class="mark">G</span><b>GRIMORA</b><span class="sub">Diagnóstico de Marketing</span></div>
    <button class="btn ghost meeting-btn has-lbl" id="btnMeetings" type="button" title="Reuniões salvas / nova reunião">
      <span data-icon="folder"></span><span class="name lbl" id="meetingName">Reunião</span>
    </button>
    <div class="spacer"></div>
    <div class="timer" id="timer" title="Cronômetro da reunião">
      <span data-icon="clock" class="t-ico"></span>
      <span class="t" id="timerText">00:00</span>
      <button class="btn" id="btnTimer" type="button" aria-label="Iniciar cronômetro"></button>
      <button class="btn" id="btnTimerReset" type="button" aria-label="Zerar cronômetro" title="Zerar"><span data-icon="reset" style="display:grid"></span></button>
    </div>
    <button class="savechip" id="chip" type="button" data-state="browser"><span class="dot"></span><span class="stxt" id="chipText">Salvando…</span><span class="sshort" id="chipShort"></span></button>
    <button class="btn has-lbl" id="btnNotes" type="button" title="Bloco de notas livre"><span data-icon="pencil"></span><span class="lbl">Bloco de notas</span></button>
    <button class="btn has-lbl" id="btnReport" type="button" title="Relatório, imprimir, PDF"><span data-icon="file"></span><span class="lbl">Relatório</span></button>
    <button class="btn icon" id="btnTheme" type="button" aria-label="Alternar tema claro/escuro"></button>
  </div>
  <div class="topprog" title="Progresso da conversa"><i id="topprogFill"></i></div>
</header>

<div class="banner" id="banner" hidden>
  <div class="banner-inner">
    <p id="bannerText"></p>
    <button class="btn primary small" id="bannerAction" type="button">Vincular arquivo</button>
    <button class="btn small ghost" id="bannerClose" type="button">Entendi</button>
  </div>
</div>

<div class="app">
  <nav class="nav" id="nav" aria-label="Seções do roteiro"></nav>
  <main id="main"></main>
</div>

<button class="fab" id="fabNotes" type="button" aria-label="Abrir bloco de notas"><span data-icon="pencil" style="display:grid"></span></button>

<aside id="drawer" hidden aria-label="Bloco de notas livre">
  <header>
    <h2>Bloco de notas</h2>
    <button class="btn small" id="btnStamp" type="button" title="Insere o horário do cronômetro"><span data-icon="clock" style="display:grid"></span>Inserir hora</button>
    <button class="iconbtn" id="btnDrawerClose" type="button" aria-label="Fechar bloco de notas"><span data-icon="x" style="display:grid"></span></button>
  </header>
  <p class="hint">Para o que não cabe em nenhuma pergunta: ideias soltas, nomes, números, pendências.</p>
  <textarea id="scratch" placeholder="Escreva livremente…"></textarea>
</aside>

<dialog id="dlgSave"><div class="dlg" id="saveBody"></div></dialog>
<dialog id="dlgMeetings"><div class="dlg" id="meetingsBody"></div></dialog>
<dialog id="dlgReport"><div class="dlg" id="reportBody"></div></dialog>
<dialog id="dlgAsk"><form method="dialog" class="dlg" id="askBody"></form></dialog>

<div id="toast" role="status" aria-live="polite"></div>
<div id="print"></div>
<input type="file" id="fileInput" accept=".json,application/json" hidden>

/* --- IndexedDB: guarda o "atalho" do arquivo vinculado de cada reunião --- */
function idbOpen() { return new Promise((res, rej) => { const r = indexedDB.open('grimora-diagnostico', 1); r.onupgradeneeded = () => r.result.createObjectStore('handles'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }

/* --- arquivo no computador --- */

}
async function writeFile() {

    const data = JSON.stringify(exportPayload(), null, 2);
    const w = await fileHandle.createWritable();
    await w.write(data); await w.close();
    fileState = 'ok'; fileSaved = Date.now(); fileErr = ''; dirtyFile = false;
  } catch (e) { fileState = 'error'; fileErr = e && e.message || 'erro desconhecido'; }
  updateChip();
}
async function loadHandle() {
  fileHandle = null; fileState = 'none'; fileSaved = null; dirtyFile = false;
  if (FS) {
    fileHandle = (await idbGet(M.id)) || null;
    if (fileHandle) {
      try { fileState = (await fileHandle.queryPermission({ mode: 'readwrite' })) === 'granted' ? 'ok' : 'perm'; } catch (_) { fileState = 'perm'; }
      if (fileState === 'ok') { scheduleFileWrite(); }

}
async function linkFile() {
  if (!FS) return;
  try {
    const h = await window.showSaveFilePicker({ suggestedName: backupName(), types: [{ description: 'Anotações da reunião (JSON)', accept: { 'application/json': ['.json'] } }] });
    fileHandle = h; await idbSet(M.id, h); fileState = 'ok';
    await writeFile();

  } catch (e) { if (e && e.name !== 'AbortError') toast('Não consegui vincular o arquivo: ' + e.message); }
  updateChip(); updateBanner(); refreshDialogs();
}
async function reconnectFile() {
  try {
    const p = await fileHandle.requestPermission({ mode: 'readwrite' });
    if (p === 'granted') { fileState = 'ok'; await writeFile(); toast('Arquivo reconectado.'); } else toast('Permissão negada.');
  } catch (e) { toast('Não consegui reconectar: ' + e.message); }
  updateChip(); refreshDialogs();
}
async function unlinkFile() {

  updateChip(); updateBanner(); refreshDialogs(); toast('Arquivo desvinculado (o arquivo continua no seu computador).');
}
async function openBackup() {
  if (window.showOpenFilePicker) {
    try {
      const [h] = await window.showOpenFilePicker({ types: [{ description: 'Anotações da reunião (JSON)', accept: { 'application/json': ['.json'] } }] });
      const f = await h.getFile(); await importFromText(await f.text(), h);
    } catch (e) { if (e && e.name !== 'AbortError') toast('Não consegui abrir: ' + e.message); }
  } else $('#fileInput').click();
}
async function importFromText(text, handle) {
  let data; try { data = JSON.parse(text); } catch (_) { toast('Esse arquivo não é um backup válido.'); return; }
  const m = data && data.app === 'grimora-diagnostico' && data.meeting;
  if (!m || !m.id) { toast('Esse arquivo não é um backup do roteiro.'); return; }
  flush();
  const cur = readStore().meetings[m.id];
  if (cur && cur.updatedAt > (m.updatedAt || 0)) {
    const ok = await ask({ title: 'Substituir a versão do navegador?', text: 'Neste navegador existe uma versão mais recente dessa reunião do que a do arquivo. Substituir mesmo assim?', ok: 'Substituir', danger: true });
    if (!ok) return;
  }
  M = normalize(m); persistLS();
  if (handle) await idbSet(M.id, handle);
  await loadHandle();
  closeDialogs(); renderAll(); toast('Reunião aberta.');
}

const rawItems = (sec, m = M) => [
  ...(sec.items || []).map((t, i) => ({ id: `${sec.id}.${i}`, text: t })),
  ...((m.custom[sec.id] || []).map(c => ({ id: c.id, text: c.text, custom: true, ref: c })))
];
const countedItems = (sec, m = M) => rawItems(sec, m).filter(i => !i.custom || i.text.trim());
function stats(sec, m = M) {
  let done = 0, flags = 0; const its = countedItems(sec, m);
  for (const it of its) { const s = m.items[it.id]; if (s && s.done) done++; if (s && s.flag) flags++; }
  return { total: its.length, done, flags };
}
function status(sec, m = M) {
  switch (sec.kind) {
    case 'intro': { const n = ['negocio', 'contato', 'telefone'].filter(k => (m.info[k] || '').trim()).length; return { label: n ? `${n}/3` : '', done: n === 3 }; }
    case 'questions': case 'observe': { const s = stats(sec, m); return { label: `${s.done}/${s.total}`, done: s.total > 0 && s.done === s.total, flags: s.flags }; }
    case 'important': return { label: m.dream.length ? String(m.dream.length) : '', done: m.dream.length > 0 };
    case 'summary': { const r = m.resumo; const n = [r.op1, r.op2, r.op3, r.prioridade, r.proxima].filter(v => v.trim()).length + ((m.services.length || m.servicesOther.trim()) ? 1 : 0); return { label: `${n}/6`, done: n === 6 }; }
    case 'closing': { const c = m.closing; const n = [c.proposta, c.quem, c.retorno].filter(Boolean).length; return { label: `${n}/3`, done: n === 3 }; }
  }
  return { label: '', done: false };
}
function overall(m = M) { let d = 0, t = 0; for (const s of SECTIONS) if (s.kind === 'questions' || s.kind === 'observe') { const x = stats(s, m); d += x.done; t += x.total; } return { done: d, total: t }; }
function flaggedList() {
  const out = [];
  for (const sec of SECTIONS) for (const it of countedItems(sec)) { const s = M.items[it.id]; if (s && s.flag) out.push({ sec, it, s }); }
  return out;
}

const elapsed = () => M.timer.ms + (M.timer.since ? Date.now() - M.timer.since : 0);
function renderTimer() {
  const run = !!M.timer.since;
  $('#timer').classList.toggle('running', run);
  $('#timerText').textContent = fmtClock(elapsed());
  const b = $('#btnTimer'); b.replaceChildren(icon(run ? 'pause' : 'play', 18));
  b.setAttribute('aria-label', run ? 'Pausar cronômetro' : 'Iniciar cronômetro');
}
function toggleTimer() {
  if (M.timer.since) { M.timer.ms += Date.now() - M.timer.since; M.timer.since = null; } else M.timer.since = Date.now();
  touch(); renderTimer();
}
async function resetTimer() {
  if (elapsed() > 60000 && !(await ask({ title: 'Zerar o cronômetro?', text: `Ele está marcando ${fmtClock(elapsed())}.`, ok: 'Zerar', danger: true }))) return;
  M.timer = { ms: 0, since: null, seen: null }; touch(); renderTimer();
}
function settleTimerOnLoad() {
  const t = M.timer;
  if (t.since) {
    const seen = t.seen || t.since;
    if (Date.now() - seen > 120000) { t.ms += Math.max(0, seen - t.since); t.since = null; }
  }
}

function updateChip(forced) {
  const chip = $('#chip'), txt = $('#chipText'); if (!chip) return;
  let state = 'browser', text = '';
  const hm = lastSaved ? fmtHM(lastSaved) : '';
  if (!lsOk) { state = 'error'; text = 'Não salvou! Baixe o backup'; }
  else if (forced === 'saving') { state = fileHandle && fileState === 'ok' ? 'ok' : (fileState === 'perm' ? 'perm' : 'browser'); text = 'Salvando…'; }
  else if (fileState === 'ok') { state = 'ok'; text = fileSaved ? `Salvo no arquivo · ${fmtHM(fileSaved)}` : `Arquivo: ${fileHandle.name}`; }
  else if (fileState === 'perm') { state = 'perm'; text = 'Reconectar arquivo'; }
  else if (fileState === 'error') { state = 'error'; text = 'Erro no arquivo — veja'; }
  else { state = FS ? 'browser' : 'ok'; text = `Salvo no navegador${hm ? ' · ' + hm : ''}`; if (FS) text = `Só neste navegador${hm ? ' · ' + hm : ''}`; }

}

    } else if (e.key === 'Escape' && !$('#drawer').hidden && !$('dialog[open]')) { $('#drawer').hidden = true; }
  });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
}
init();
})();
</script>
